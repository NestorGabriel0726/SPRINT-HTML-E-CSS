<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ford Brasil | Lançamentos</title>
    <link rel="icon" type="ford-96.png" href="src/img/ford-96.png">
    <link rel="stylesheet" href="src/css/reset.css">
    <link rel="stylesheet" href="src/index.css">
    <link rel="stylesheet" href="header.css">
    <link rel="stylesheet" href="footer.css">
    <link rel="stylesheet" href="src/css/lancamento.css">

</head>
<body>
     <header>
        <img class="logo_header" src="src/img/logo-ford-256.png" alt="Logo da Ford Motor Company">
        
        <!-- Criando a barra de navegação da página -->
        <nav class="nav_header">
        <ul>
           <li><a href="index.html">Home</a></li>
        
            <li><a href="Lançamento.html">Lançamento</a></li>
        
            <li><a href="contato.html">Contato</a></li>
        </ul>
        </nav>

    </header>

    <main>

        <div class="video_main"> <!--Adicionando o vídeo na página-->

            <iframe width="100%" height="700" src="https://www.youtube.com/embed/vQsryuNmsL0" title="Ford Ranger 2022 | Gerações" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        
        </div>

        <div class="Lançamentos"> <!--Adicionando as imagens e checkbox dentro de um container principal-->

            <!--Os três containers a seguir serão secundários, e todos conterão: uma imagem do carro ofertado, um formulário com um input checkbox, e uma imagem do botão de info-->

            <div class="box_1"> <!--Container secundário-->

                <img src="src/img/XL Cabine.jpg" alt="Ranger XL Cabine simples">

                <div class="formulario"> <!--Esse container serve para organizar os elementos do formulário.-->

                    <form>
                    <input type="checkbox" id="RangerXL" name="RangerXL Cabine simples">
                    <label for="RangerXL"> <strong> XL Cabine Simples 2.2 Diesel 4X4 MT 2022 </strong>
                    <br> <span> Preço Sugerido: R$183.850 </span> </label>
                    </form>

                    <div class="button_info"> <!--botão de informação-->
                     <img src="src/img/info.png" alt="Botão de informação">
                    </div>
                    
                </div>
                

            </div>

            <div class="box_2"> <!--Container secundário-->

                <img src="src/img/xls 2.2 diesel.jpg" alt="Ranger XLS 2.2 Diesel">

                <div class="formulario"> <!--Esse container serve para organizar os elementos do formulário, inclusive o botão de informação-->

                    <form>
                    <input type="checkbox" id="RangerXLS" name="Ranger XLS 2.2 Diesel">
                    <label for="RangerXLS"> <strong> XLS 2.2 Diesel 4X4 AT 2022 </strong>
                    <br> <span> Preço Sugerido: R$220.690 </span> </label>
                    </form>

                    <div class="button_info"> <!--botão de informação-->
                     <img src="src/img/info.png" alt="Botão de informação">
                    </div>

                </div>
                

            </div>

            <div class="box_3"> <!--Container secundário-->

                <img src="src/img/storm.jpg" alt="Ranger Storm">

                <div class="formulario"> <!--Esse container serve para organizar os elementos do formulário, inclusive o botão de informação-->

                    <form >
                    <input type="checkbox" id="Storm" name="Ranger Storm">
                    <label for="Storm"> <strong> Storm 3.2 Diesel 4X4 AT 2022 </strong> 
                    <br> <span> Preço Sugerido: R$222.790 </span> </label>
                    </form>

                    <div class="button_info"> <!--botão de informação-->
                     <img src="src/img/info.png" alt="Botão de informação">
                    </div>

                </div>
                
            
            </div>

        </div>

            <div class="button"> <!--Container para armazenar o botão-->
                <button type="submit">Comparar Carros</button>
            </div>

       
    </main>

    <footer>

        <div class="redes_sociais">

            <p>Redes Sociais</p>

            <a href="https://www.facebook.com/FordBrasil/" target="_blank">
                <img src="src/img/facebook-50.png" alt="Logo Facebook">
            </a>

            <a href="https://www.youtube.com/fordbrasil" target="_blank">
                <img src="src/img/youtube-squared-50.png" alt="Logo YouTube">
            </a>

            <a href="https://www.instagram.com/fordbrasil/" target="_blank">
                <img src="src/img/instagram-logo-50.png" alt="Logo Instagram">
            </a>

        </div>
        

        <div class="copyright">
            <p>&copy; 2026 Ford Brasil | Viva o Novo. Todos os direitos reservados.</p>
        </div>

        <img class="logo_footer" src="src/img/ford-96.png" alt="Logo da Ford">
    </footer>
</body>
</html>
