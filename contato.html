<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ford Brasil | Lançamentos</title>
    <link rel="icon" type="ford-96.png" href="src/img/ford-96.png">
    <link rel="stylesheet" href="src/css/reset.css">
    <link rel="stylesheet" href="src/css/contato.css">
    <link rel="stylesheet" href="src/css/header.css">
    <link rel="stylesheet" href="src/css/footer.css">
    <script src="js/form.js"></script>

</head>
<body>
    <header>
        <img class="logo_header" src="src/img/logo-ford-256.png" alt="Logo da Ford Motor Company">
        
        <!-- Criando a barra de navegação da página -->
        <nav class="nav_header">
        <ul>
           <li><a href="index.html">Home</a></li>
        
            <li><a href="Lançamento.html">Lançamento</a></li>
        
            <li><a href="contato.html">Contato</a></li>
        </ul>
        </nav>

    </header>

    <main>
       
        <div class="image_main">

            <img src="src/img/xls 2.2 diesel.jpg" alt="Ranger XLS 2.2 Diesel">
        
        </div>

        <div class="form_main">

            <form onsubmit="Post(this);">
                <h2>Sobre Você</h2>
                <input type="text" name="nome" id="nome" placeholder="NOME*" required> 
                <input type="email" name="email" placeholder="E-MAIL*" required> 
                <input type="tel" name="telefone" placeholder="TELEFONE*" required>

                <label for="">

                    <select name="contato" required>
                        <option value="" disabled selected>TIPO DE CONTATO*</option>
                        <option>ELOGIO</option>
                        <option>RECLAMAÇÃO</option>
                        <option>SOLICITAÇÃO</option>
                    </select>    

                <textarea name="mensagem" placeholder="DIGITE SUA MENSAGEM AQUI*" rows="4" cols="50" required></textarea>
                 

                
                    
                    <p>*Campo obrigatório</p>    

                </label>

            <div class="button_send">
                <button type="submit" id="buttonSend" onclick="Enviar()">Enviar</button>
            </div>

            </form>

        </div>

    </main>

    <footer>

        <div class="redes_sociais">

            <p>Redes Sociais</p>

            <a href="https://www.facebook.com/FordBrasil/" target="_blank">
                <img src="src/img/facebook-50.png" alt="Logo Facebook">
            </a>

            <a href="https://www.youtube.com/fordbrasil" target="_blank">
                <img src="src/img/youtube-squared-50.png" alt="Logo YouTube">
            </a>

            <a href="https://www.instagram.com/fordbrasil/" target="_blank">
                <img src="src/img/instagram-logo-50.png" alt="Logo Instagram">
            </a>

        </div>
        

        <div class="copyright">
            <p>&copy; 2026 Ford Brasil | Viva o Novo. Todos os direitos reservados.</p>
        </div>

        <img class="logo_footer" src="src/img/ford-96.png" alt="Logo da Ford">
    </footer>

    <div id="customAlert" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-header">
                <img src="src/img/ford-96.png" alt="Ford Logo" class="modal-logo">
                <h3 class="modal-title">Notificação Ford</h3>
            </div>
            <div class="modal-body">
                <p id="modalMessage"></p>
            </div>
            <div class="modal-footer">
                <button type="button" class="modal-btn" onclick="fecharModal()">Ok</button>
            </div>
        </div>
    </div>
</body>
</html>
